name: Update pinned projects in profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    paths:
      - "scripts/update_pinned_projects.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update-pinned-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync pinned repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: eldarshiraliyev
        run: python scripts/update_pinned_projects.py
      - name: Commit updated README if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: sync pinned repositories"
          git push
